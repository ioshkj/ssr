name: update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upd
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          pip install -q pyyaml
          mkdir -p bin
          curl -sL --retry 3 -o bin/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz
          gunzip -f bin/mihomo.gz && chmod +x bin/mihomo && ./bin/mihomo -v
      - name: build
        run: |
          set -o pipefail
          python -u sub_build.py 2>&1 | tee build.log

      - name: save log
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f build.log
          git commit -q -m "log" || true
          git push -q || true
      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A sub/
          if git diff --staged --quiet; then echo none; else git commit -m "update" && git push; fi
