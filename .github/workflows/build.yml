name: update

on:
  push:
    branches: [main]
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upd
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          pip install -q pyyaml
          mkdir -p bin
          curl -sL --retry 3 -o bin/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz
          gunzip -f bin/mihomo.gz && chmod +x bin/mihomo && ./bin/mihomo -v
      - name: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u discover.py $(date -u -d '2 days ago' +%Y-%m-%d) 2>&1 | tail -5 || true
      - name: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u sub_build.py 2>&1 | tee build.log || true
      - name: probe
        run: python -u probe_sub.py 2>&1 | tee probe.log || true
      - name: next
        if: success()
        env:
          PAT: ${{ secrets.PAT_TOKEN }}
        run: |
          TOKEN="${PAT:-$GITHUB_TOKEN}"
          sleep 5
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST             -H "Authorization: Bearer $TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches"             -d '{"ref":"main"}')
          echo "dispatch http=$code"
          cat /tmp/resp.txt || true
      - name: save
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f build.log probe.log 2>/dev/null || true
          git add -A sub/ 2>/dev/null || true
          git add -f sources.json 2>/dev/null || true
          git commit -q -m "update" 2>/dev/null || true
          for i in 1 2 3; do git push -q && break; sleep 5; done
