name: probe

on:
  push:
    paths:
      - probe_sub.py
      - sub/ivapp.cn
  workflow_dispatch:

permissions:
  contents: write

jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          mkdir -p bin
          curl -sL --retry 3 -o bin/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz
          gunzip -f bin/mihomo.gz && chmod +x bin/mihomo
      - name: probe
        run: python -u probe_sub.py 2>&1 | tee probe.log || true
      - name: save
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f sub/probe.txt probe.log 2>/dev/null || true
          git commit -q -m "update" 2>/dev/null || true
          for i in 1 2 3; do git push -q && break; sleep 5; done
