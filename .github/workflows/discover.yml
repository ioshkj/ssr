name: discover

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python discover.py $(date -u -d '2 days ago' +%Y-%m-%d)
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add sources.json
          if git diff --staged --quiet; then echo none; else git commit -m "update" && git push; fi
